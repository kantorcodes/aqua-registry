name: One-shot signed HOL Guard registry commit
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hashgraph-online/hol-guard
          fetch-depth: 1
      - name: Create verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, subprocess
          paths = [
              "pkgs/hashgraph-online/hol-guard/pkg.yaml",
              "pkgs/hashgraph-online/hol-guard/registry.yaml",
              "registry.yaml",
          ]
          additions = []
          for path in paths:
              with open(path, "rb") as f:
                  additions.append({"path": path, "contents": base64.b64encode(f.read()).decode("ascii")})
          query = """mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input:$input) { commit { oid url signature { isValid wasSignedByGitHub } } ref { name target { ... on Commit { oid } } } } }"""
          payload = {
              "query": query,
              "variables": {"input": {
                  "branch": {"repositoryNameWithOwner": "kantorcodes/aqua-registry", "branchName": "feat/hashgraph-online/hol-guard-signed"},
                  "expectedHeadOid": "d57aed6e9bbd97c75e44e49548b0134cb3ed5dee",
                  "message": {"headline": "feat(hashgraph-online/hol-guard): add package"},
                  "fileChanges": {"additions": additions},
              }},
          }
          proc = subprocess.run(["gh", "api", "graphql", "--input", "-"], input=json.dumps(payload), text=True, capture_output=True)
          print(proc.stdout)
          if proc.returncode:
              print(proc.stderr)
              raise SystemExit(proc.returncode)
          PY
