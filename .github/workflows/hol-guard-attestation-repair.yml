name: One-shot HOL Guard attestation repair
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/hashgraph-online/hol-guard-signed-v2
          fetch-depth: 1
      - name: Create verified aggregate registry repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, subprocess
          path = "registry.yaml"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()
          old = """      - version_constraint: semver("<= 3.0.189")
        asset: hol_guard-{{trimV .Version}}-py3-none-many{{.OS}}_2_17_{{.Arch}}.whl
        format: raw
        windows_arm_emulation: true
        complete_windows_ext: false
        replacements:
          amd64: x86_64
          darwin: macosx
          windows: win
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        slsa_provenance:
          type: github_release
          asset: hol-guard-{{.Version}}.intoto.jsonl
        overrides:
"""
          new = """      - version_constraint: semver("<= 3.0.189")
        asset: hol_guard-{{trimV .Version}}-py3-none-many{{.OS}}_2_17_{{.Arch}}.whl
        format: raw
        windows_arm_emulation: true
        complete_windows_ext: false
        replacements:
          amd64: x86_64
          darwin: macosx
          windows: win
        checksum:
          type: github_release
          asset: "{{.Asset}}.sha256"
          algorithm: sha256
        # Disable slsa_provenance
        # FAILED: SLSA verification failed: untrusted reusable workflow: https://github.com/hashgraph-online/hol-guard/.github/workflows/publish.yml with builderID provided: false
        github_artifact_attestations:
          signer_workflow: hashgraph-online/hol-guard/.github/workflows/publish.yml
        overrides:
"""
          if text.count(old) != 1:
              raise SystemExit(f"expected one target block, found {text.count(old)}")
          updated = text.replace(old, new, 1)
          query = """mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input:$input) { commit { oid url signature { isValid wasSignedByGitHub } } } }"""
          payload = {
              "query": query,
              "variables": {"input": {
                  "branch": {"repositoryNameWithOwner": "kantorcodes/aqua-registry", "branchName": "feat/hashgraph-online/hol-guard-signed-v2"},
                  "expectedHeadOid": "660f2277932b3b41a142683a305c674687f39597",
                  "message": {"headline": "fix(hashgraph-online/hol-guard): verify GitHub attestations"},
                  "fileChanges": {"additions": [{"path": path, "contents": base64.b64encode(updated.encode("utf-8")).decode("ascii")}]},
              }},
          }
          proc = subprocess.run(["gh", "api", "graphql", "--input", "-"], input=json.dumps(payload), text=True, capture_output=True)
          print(proc.stdout)
          if proc.returncode:
              print(proc.stderr)
              raise SystemExit(proc.returncode)
          result = json.loads(proc.stdout)["data"]["createCommitOnBranch"]["commit"]
          sig = result.get("signature") or {}
          if not sig.get("isValid") or not sig.get("wasSignedByGitHub"):
              raise SystemExit("created commit was not GitHub-signed")
          print(result["oid"])
          PY
